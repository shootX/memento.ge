name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memento
          POSTGRES_PASSWORD: memento
          POSTGRES_DB: memento_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memento -d memento_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://memento:memento@localhost:5432/memento_test
      SESSION_SECRET: ci-session-secret-32-characters!!
      MEDIA_SIGNING_SECRET: ci-media-signing-secret-32chars!!
      CSRF_SECRET: ci-csrf-secret-32-characters!!!
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: ./data/test-uploads
      EMAIL_PROVIDER: log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npm run seed:photos
      - run: npx prisma migrate deploy
      - run: npm run ensure:demo
      - run: npm run dev &
      - run: npx wait-on http://localhost:43123 -t 60000
      - run: npm run test:e2e
      - run: npm audit --audit-level=high || true
